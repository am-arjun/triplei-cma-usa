<!doctype html>
<html lang="en-IN" data-brand="triplei">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMA USA Course in Kerala | Up to 100% Scholarship | Triple i</title>
    <meta name="description" content="Learn CMA USA from Kerala's Most Trusted Institute with up to 100% Scholarship. Only 2 exams, complete in 1 year, with offline, online (hybrid), live and recorded classes." />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:description" content="Become a globally recognised Certified Management Accountant and build a finance career anywhere in the world." />
    <meta name="twitter:card" content="summary" />
    <!-- Apply the theme before the stylesheet paints so there is no light→dark flash.
         Order: ?theme= in the URL, then the saved choice (lp:theme), then the OS setting. -->
    <script>
      ;(function () {
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var t = q === 'dark' || q === 'light' ? q : localStorage.getItem('lp:theme')
          if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
